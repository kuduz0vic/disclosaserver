name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests stub playwright and the network; only the pure dependencies are needed
      - run: pip install requests==2.32.3 tzdata==2025.2
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile worker_poll.py scraper_core.py
